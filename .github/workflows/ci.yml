name: "CI"

on:
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "docker-compose.yml"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "nest-cli.json"
      - ".github/workflows/ci.yml"

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

env:
  NODE_VERSION: "22"

jobs:
  build:
    name: "Build and Push"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Generate tag
        id: generate_tag
        run: |
          SHA=$(echo $GITHUB_SHA | head -c7)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: sa-east-1
          role-to-assume: arn:aws:iam::958157975241:role/ecr-role

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ steps.generate_tag.outputs.sha }}
        run: |
          docker build -t $ECR_REGISTRY/estudos-ci-cd:$TAG .
          docker push $ECR_REGISTRY/estudos-ci-cd:$TAG
          docker tag $ECR_REGISTRY/estudos-ci-cd:$TAG $ECR_REGISTRY/estudos-ci-cd:latest
          docker push $ECR_REGISTRY/estudos-ci-cd:latest
          IMAGE=$(echo $ECR_REGISTRY/estudos-ci-cd:$TAG)
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Deploy to ECS Express
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: estudos-ci-cd
          image: ${{ steps.build-image.outputs.image }}
          execution-role-arn: arn:aws:iam::958157975241:role/ecs-execution-role
          infrastructure-role-arn: arn:aws:iam::958157975241:role/ecs-express-infrastructure-role
          container-port: 3000
          cpu: "256"
          memory: "512"
